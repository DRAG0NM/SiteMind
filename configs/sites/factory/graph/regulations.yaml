# 厂内规程条款原文（synthetic：按常理编写的虚拟厂内规程，不是国家标准原文）。
# 图谱里的安全标记、优先级和预案都引用这里的条款编号，展示页点开依据时显示原文。
# B26 资料入库后可以用真实规程条款替换，编号保持不变或在 graph.yaml 改引用。
nature: synthetic
document: 《华东某中型工厂安全运行规程》（虚拟，2026 版）
clauses:
  SR-0.1: 各类调度目标冲突时，人员安全优先于生产、舒适和成本，任何时段、任何场景不得调整这一顺序。
  SR-1.1: 电梯断电、停梯、检修、松闸和移动轿厢前，必须确认轿厢内无人；无法确认时按有人处理，由持证人员现场复核后方可操作。
  SR-1.2: 发生电梯困人，值班人员应立即通知维保单位并安抚被困人员；救援由持证人员按盘车规程执行，系统不得自动操作故障电梯。
  SR-2.1: 消防泵、应急照明回路属生命安全设施，不得纳入削峰、错峰或节能停运范围；任何改变其状态的操作须经值班人员确认。
  SR-3.1: 危化品仓库内的排风、照明和配电操作，须由安全员确认并开具操作单后执行；排风中断期间禁止人员进入。
  SR-3.2: 数据机房供电与精密空调不得因削峰、错峰而断开或降额；失电时值班电工须在 UPS 剩余时长内恢复供电。
  SR-3.3: 洁净车间温湿度为硬约束（22±1 ℃、45±5 %RH），削峰、预冷推迟和设定值调整不得作用于洁净车间空调与其供电。
  SR-4.1: 压缩空气主管网压力下降速率异常时，按泄漏处理：定位并隔离泄漏支管，开维修工单，受影响工序顺延。
  SR-5.1: 变压器负荷逼近容量上限时，按储能放电、可平移工序顺延、非安全区暖通让步、电梯分区运行的顺序削减，不得对带安全标记的区域削负荷。
